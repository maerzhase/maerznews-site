<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Cortegaça Chronicle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Old+Standard+TT&display=swap" rel="stylesheet" />
  <style>
    :root { --paper: #f5f1e6; --paper-2: #efe9da; --ink: #1b1917; --ink-2: #403a34; --ink-3: #6b625a; --rule: #c9bfae; --rule-2: #a89c88; --accent: #9c2b1e; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 "PT Serif", Georgia, serif; padding: 26px 16px 40px; -webkit-font-smoothing: antialiased; }
    .sheet { max-width: 760px; margin: 0 auto; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .caps { font-family: "Old Standard TT", Georgia, serif; text-transform: uppercase; letter-spacing: .14em; }
    .ear { border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); padding: 5px 0; text-align: center; font-size: .72rem; color: var(--ink-2); }
    .ear a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .nameplate { text-align: center; font: 900 clamp(2.1rem, 9vw, 4.2rem)/1.02 "Playfair Display", Georgia, serif; letter-spacing: -.015em; margin: .26em 0 .25em; }
    .nameplate .the { display: block; font-size: .24em; font-weight: 400; letter-spacing: .44em; text-transform: uppercase; margin-bottom: .5em; color: var(--ink-2); font-family: "Old Standard TT", Georgia, serif; }

    .today { display: block; border-top: 3px double var(--rule-2); border-bottom: 3px double var(--rule-2); padding: 12px 0 13px; text-align: center; }
    .today-k { display: block; font: .7rem "Old Standard TT", Georgia, serif; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
    .today-h { display: block; font: 700 clamp(1.25rem, 3.4vw, 1.6rem)/1.15 "Playfair Display", Georgia, serif; text-wrap: balance; }
    .today-go { display: block; font: .7rem "Old Standard TT", Georgia, serif; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin-top: 6px; }
    .today:hover .today-h { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }

    .searchbox { margin: 26px 0 10px; position: relative; }
    .searchbox label { display: block; font: .68rem "Old Standard TT", Georgia, serif; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
    .searchbox input { width: 100%; font: 400 1.35rem/1.3 "Playfair Display", Georgia, serif; color: var(--ink); background: #fbf9f3; border: 0; border-bottom: 2px solid var(--ink); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); border-right: 1px solid var(--rule); padding: 12px 44px 12px 14px; border-radius: 0; -webkit-appearance: none; appearance: none; }
    .searchbox input::placeholder { color: var(--rule-2); font-style: italic; }
    .searchbox input:focus { outline: none; border-bottom-color: var(--accent); background: #fff; }
    .searchbox input::-webkit-search-cancel-button, .searchbox input::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    .searchbox .clear { position: absolute; right: 6px; bottom: 9px; width: 34px; height: 34px; border: 0; background: transparent; color: var(--ink-3); font-size: 1.3rem; cursor: pointer; display: none; }
    .searchbox.has-q .clear { display: block; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px 6px; margin: 10px 0 4px; }
    .chips button { font: .64rem "Old Standard TT", Georgia, serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); background: transparent; border: 1px solid var(--rule); padding: 4px 8px; cursor: pointer; border-radius: 0; }
    .chips button:hover { border-color: var(--ink-3); }
    .chips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

    .count { font: .66rem "Old Standard TT", Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin: 14px 0 0; min-height: 1.2em; }

    .day { margin-top: 22px; }
    .dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); padding: 6px 0 5px; font: .7rem "Old Standard TT", Georgia, serif; letter-spacing: .16em; text-transform: uppercase; }
    .dayhead a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .dayhead .no { color: var(--ink-3); white-space: nowrap; }
    .item { padding: 12px 0 13px; border-bottom: 1px dotted var(--rule-2); }
    .item:last-child { border-bottom: 0; }
    .k { display: block; font: .62rem "Old Standard TT", Georgia, serif; letter-spacing: .15em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
    .k .sec { color: var(--accent); }
    .h { font: 700 1.12rem/1.2 "Playfair Display", Georgia, serif; margin: 0 0 4px; text-wrap: balance; }
    .item.lead .h { font-size: 1.3rem; font-weight: 900; }
    .h a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
    .meta { font: .62rem "Old Standard TT", Georgia, serif; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 4px; }
    .snip { font-size: .93rem; line-height: 1.5; color: var(--ink-2); margin: 0; text-wrap: pretty; }
    .foot { font: .6rem "Old Standard TT", Georgia, serif; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 5px; }
    .foot a { border-bottom: 1px solid var(--rule); }
    .foot a:hover { color: var(--ink); border-color: var(--ink); }
    mark { background: #ecd9b0; color: inherit; padding: 0 1px; }

    .more { display: block; margin: 22px auto 0; font: .7rem "Old Standard TT", Georgia, serif; letter-spacing: .18em; text-transform: uppercase; background: transparent; color: var(--ink); border: 1px solid var(--ink); padding: 9px 16px; cursor: pointer; border-radius: 0; }
    .more[hidden] { display: none; }
    .more:hover { background: var(--ink); color: var(--paper); }
    .empty { text-align: center; font-style: italic; color: var(--ink-3); margin: 34px 0; }
    .colophon { border-top: 1px solid var(--rule-2); border-bottom: 1px solid var(--rule-2); margin-top: 34px; padding: 6px 0; text-align: center; font: .66rem "Old Standard TT", Georgia, serif; letter-spacing: .18em; text-transform: uppercase; color: var(--ink-2); }
    .colophon a:hover { text-decoration: underline; text-underline-offset: 3px; }
  </style>
</head>
<body>
<div class="sheet" lang="en">
  <header>
    <div class="ear caps">17 editions · 463 articles · <a href="archive.html">All editions</a></div>
    <h1 class="nameplate"><span class="the">The</span>Cortegaça Chronicle</h1>
    <a class="today" href="editions/2026-10-08.html">
      <span class="today-k">Today's paper · Thursday, 8 October 2026 · No. 18</span>
      <span class="today-h">Margaret Hamilton, who led the code that landed Apollo 11 and named &quot;software engineering&quot;, dies at 90</span>
      <span class="today-go">Read the edition →</span>
    </a>
  </header>

  <div class="searchbox" id="sb">
    <label for="q">Search every article</label>
    <input id="q" type="search" placeholder="Berlin, Ovar, Serralves, Nobel…" autocomplete="off" spellcheck="false" enterkeyhint="search" />
    <button class="clear" id="clear" type="button" aria-label="Clear search">×</button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Filter by section"></div>
  <div class="count" id="count" aria-live="polite"></div>
  <main id="list"></main>
  <button class="more" id="more" type="button" hidden>Show more</button>
  <noscript><p class="empty">Search needs JavaScript. <a href="archive.html">Browse all editions</a>.</p></noscript>

  <div class="colophon"><a href="archive.html">All editions</a></div>
</div>
<script>
(() => {
  const PAGE = 60;
  // Section names have drifted a little between editions; fold them into stable filter groups.
  const GROUPS = [
    ["Front page", s => s === "Front page"],
    ["Cortegaça & Ovar", s => /corteg|ovar|aveiro|local/i.test(s)],
    ["Germany", s => /german|berlin/i.test(s)],
    ["Portugal", s => /portugal|porto/i.test(s)],
    ["Technology", s => /tech|machine/i.test(s)],
    ["Screen", s => /screen|film|cinema/i.test(s)],
    ["Arts", s => /^art/i.test(s)],
    ["Sound", s => /sound|music/i.test(s)],
    ["Now Streaming", s => /stream/i.test(s)],
    ["The World", s => /world/i.test(s)],
  ];
  const groupOf = s => (GROUPS.find(([, f]) => f(s)) || ["Other"])[0];
  const norm = s => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/ß/g, "ss");
  const words = s => " " + norm(s).replace(/[^a-z0-9]+/g, " ").trim() + " ";
  const esc = s => (s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // One folded character per UTF-16 unit, so positions in the folded string match the original.
  const fold = s => { let o = ""; for (let i = 0; i < s.length; i++) { const f = norm(s[i]).charAt(0); o += /[a-z0-9]/.test(f) ? f : " "; } return o; };
  const longDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

  const $ = id => document.getElementById(id);
  const q = $("q"), list = $("list"), count = $("count"), more = $("more"), chips = $("chips"), sb = $("sb");
  let all = [], hits = [], shown = 0, terms = [], section = "";

  // Parse a query into terms; "quoted phrases" stay together. Each term matches at a word start.
  function parse(raw) {
    const out = [];
    raw.replace(/"([^"]+)"|(\S+)/g, (_, ph, w) => { const t = norm(ph || w).replace(/[^a-z0-9]+/g, " ").trim(); if (t) out.push(t); });
    return out;
  }

  // Highlight terms in original text by mapping accent-folded positions back onto it.
  function mark(text, ts) {
    if (!ts.length || !text) return esc(text);
    const flat = fold(text);
    const ranges = [];
    for (const t of ts) {
      let i = 0;
      while ((i = flat.indexOf(t, i)) !== -1) {
        if (i === 0 || flat[i - 1] === " ") ranges.push([i, i + t.length]);
        i += t.length;
      }
    }
    if (!ranges.length) return esc(text);
    ranges.sort((a, b) => a[0] - b[0]);
    let out = "", pos = 0;
    for (const [a, b] of ranges) {
      if (a < pos) continue;
      out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>";
      pos = b;
    }
    return out + esc(text.slice(pos));
  }

  function snippet(a, ts) {
    const t = a.t || "";
    const max = a.lead ? 300 : 230;
    if (!ts.length) return t.length > max ? t.slice(0, t.lastIndexOf(" ", max)) + " …" : t;
    const flat = fold(t);
    let at = -1;
    for (const term of ts) {
      let i = 0;
      while ((i = flat.indexOf(term, i)) !== -1) { if (i === 0 || flat[i - 1] === " ") { at = at === -1 ? i : Math.min(at, i); break; } i += term.length; }
    }
    if (at === -1 || t.length <= max) return t.length > max ? t.slice(0, t.lastIndexOf(" ", max)) + " …" : t;
    let start = Math.max(0, at - 70);
    start = start === 0 ? 0 : t.indexOf(" ", start) + 1;
    let end = Math.min(t.length, start + max);
    end = end === t.length ? end : t.lastIndexOf(" ", end);
    return (start > 0 ? "… " : "") + t.slice(start, end) + (end < t.length ? " …" : "");
  }

  function run() {
    const raw = q.value;
    terms = parse(raw);
    sb.classList.toggle("has-q", raw.length > 0);
    hits = all.filter(a => (!section || a.g === section) && terms.every(t => a.hay.includes(" " + t)));
    shown = 0;
    list.innerHTML = "";
    render();
    const n = hits.length;
    const eds = new Set(hits.map(a => a.d)).size;
    count.textContent = terms.length || section
      ? (n ? `${n} ${n === 1 ? "match" : "matches"} in ${eds} ${eds === 1 ? "edition" : "editions"}` : "")
      : `Every article, newest first`;
    if (!n) list.innerHTML = `<p class="empty">Nothing found${raw ? ` for “${esc(raw)}”` : ""}${section ? ` in ${esc(section)}` : ""}.</p>`;
    const u = new URL(location.href);
    raw ? u.searchParams.set("q", raw) : u.searchParams.delete("q");
    section ? u.searchParams.set("s", section) : u.searchParams.delete("s");
    history.replaceState(null, "", u);
  }

  function render() {
    const batch = hits.slice(shown, shown + PAGE);
    let lastDay = shown > 0 ? hits[shown - 1].d : null, box = list.lastElementChild;
    for (const a of batch) {
      if (a.d !== lastDay) {
        box = document.createElement("section");
        box.className = "day";
        box.innerHTML = `<div class="dayhead"><a href="editions/${a.d}.html">${esc(longDate(a.d))}</a><span class="no">${a.no ? "No. " + a.no : ""}</span></div>`;
        list.appendChild(box);
        lastDay = a.d;
      }
      const el = document.createElement("article");
      el.className = "item" + (a.lead ? " lead" : "");
      const kick = [a.lead ? "Front page" : a.sec, a.k].filter(Boolean);
      el.innerHTML =
        `<span class="k"><span class="sec">${mark(kick[0] || "", terms)}</span>${kick[1] ? " · " + mark(kick[1], terms) : ""}</span>` +
        `<h2 class="h"><a href="${esc(a.e)}">${mark(a.h, terms)}</a></h2>` +
        (a.m ? `<p class="meta">${mark(a.m, terms)}</p>` : "") +
        `<p class="snip">${mark(snippet(a, terms), terms)}</p>` +
        `<div class="foot">${esc(a.s)}${a.u ? ` · <a href="${esc(a.u)}" target="_blank" rel="noopener">original ↗</a>` : ""}</div>`;
      box.appendChild(el);
    }
    shown += batch.length;
    more.hidden = shown >= hits.length;
  }

  function buildChips() {
    const present = new Set(all.map(a => a.g));
    const names = ["", ...GROUPS.map(([n]) => n).filter(n => present.has(n)), ...(present.has("Other") ? ["Other"] : [])];
    chips.innerHTML = names.map(n => `<button type="button" data-s="${esc(n)}" aria-pressed="${n === section}">${esc(n || "All")}</button>`).join("");
  }

  let timer;
  q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 90); });
  $("clear").addEventListener("click", () => { q.value = ""; run(); q.focus(); });
  more.addEventListener("click", render);
  chips.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    section = b.dataset.s;
    chips.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.s === section)));
    run();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
    if (e.key === "Escape" && document.activeElement === q && q.value) { q.value = ""; run(); }
  });

  const params = new URLSearchParams(location.search);
  q.value = params.get("q") || "";
  section = params.get("s") || "";
  count.textContent = "Loading the archive…";
  fetch("articles.json?v=2026-10-08-463")
    .then(r => r.json())
    .then(data => {
      all = data.map(a => ({ ...a, g: groupOf(a.sec), hay: words([a.h, a.k, a.sec, a.m, a.t, a.s].join(" ")) }));
      buildChips();
      run();
    })
    .catch(() => { count.textContent = ""; list.innerHTML = `<p class="empty">The article index could not be loaded. <a href="archive.html">Browse all editions</a>.</p>`; });
})();
</script>
</body>
</html>
